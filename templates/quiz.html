<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { 
            max-width: 600px; 
            margin: 5px auto; 
            background: white; 
            padding: 12px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .timer { 
            color: #dc3545; 
            font-weight: bold; 
            text-align: right; 
            margin-bottom: 12px;
            font-size: 18px;
            background: #ffe8e8;
            padding: 10px;
            border-radius: 8px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }
        .question-header { 
            margin-bottom: 8px;
            flex: 1;
        }
        .question-header h3 {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .question-header p { 
            margin: 0;
            font-size: 1.05em;
            font-weight: 600;
            line-height: 1.4;
            color: #333;
            word-wrap: break-word;
            text-align: center;
        }
        .options { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .option-btn { 
            padding: 12px 12px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            text-align: left;
            transition: all 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,123,255,0.2);
        }
        .option-btn:active { 
            background: #003d82;
            transform: scale(0.98);
            box-shadow: 0 1px 3px rgba(0,123,255,0.2);
        }
        
        @media (max-width: 600px) {
            body { padding: 6px; }
            .container { 
                padding: 10px; 
                margin: 3px auto; 
                border-radius: 10px;
            }
            .timer { 
                font-size: 16px; 
                padding: 8px; 
                margin-bottom: 10px;
                min-height: 38px;
            }
            .question-header { margin-bottom: 6px; }
            .question-header h3 { font-size: 11px; margin: 0 0 8px 0; }
            .question-header p { font-size: 0.95em; line-height: 1.3; }
            .options { gap: 8px; margin-top: 8px; grid-template-columns: 1fr 1fr; }
            .option-btn { 
                padding: 10px 8px; 
                min-height: 40px; 
                font-size: 13px;
            }
        }
        @media (max-width: 380px) {
            body { padding: 4px; }
            .container { padding: 8px; margin: 2px auto; }
            .timer { font-size: 14px; padding: 6px; margin-bottom: 8px; min-height: 36px; }
            .question-header { margin-bottom: 4px; }
            .question-header h3 { font-size: 10px; margin: 0 0 6px 0; }
            .question-header p { font-size: 0.9em; line-height: 1.2; }
            .options { gap: 6px; margin-top: 6px; grid-template-columns: 1fr 1fr; }
            .option-btn { padding: 8px 6px; min-height: 38px; font-size: 12px; }
        }
    </style>

    <script>
        let time = 600;
        function startTimer(){
            setInterval(()=>{
                let m = Math.floor(time/60);
                let s = time%60;
                document.getElementById("timer").innerText = m+":"+(s<10?"0":"")+s;
                time--;
                if(time < 0){ window.location = "/result"; }
            },1000);
        }
        window.onload = startTimer;
    </script>
</head>
<body>
    <div class="container">
        <div class="timer">⏱ <span id="timer">3:00</span></div>
        <div class="question-header">
            <h3>Въпрос {{ q_index }} / {{ total }}</h3>
            <p>{{ question }}</p>
        </div>

        <form action="/answer" method="post">
            <div class="options">
                {% for option in options %}
                <button type="submit" name="selected_option" value="{{ option }}" class="option-btn">
                    {{ option }}
                </button>
                {% endfor %}
            </div>
        </form>
    </div>
</body>
</html>
