<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
    <style>
        body { font-family: Arial; background:#eef2f7; }
        .container { max-width:500px; margin:80px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px #ccc; }
        input { width:100%; padding:10px; margin-top:15px; }
        button { margin-top:15px; padding:10px; width:100%; background:#28a745; color:white; border:none; }
        .timer { color:red; font-weight:bold; text-align:right; }
    </style>

    <script>
        let time = 600;
        function startTimer(){
            setInterval(()=>{
                let m = Math.floor(time/60);
                let s = time%60;
                document.getElementById("timer").innerText = m+":"+(s<10?"0":"")+s;
                time--;
                if(time < 0){ window.location = "/result"; }
            },1000);
        }
        window.onload = startTimer;
    </script>
</head>
<body>
    <div class="container">
        <div class="timer">⏱ <span id="timer">3:00</span></div>
        <h3>Въпрос {{ q_index }} / {{ total }}</h3>
        <p>{{ question }}</p>

        <form action="/answer" method="post">
            <input name="user_answer" placeholder="Твоят отговор" required>
            <button type="submit">Отговори</button>
        </form>
    </div>
</body>
</html>
