<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background:#eef2f7;
            margin: 0;
            padding: 10px;
        }
        .container { 
            max-width:600px; 
            margin: 10px auto; 
            background:white; 
            padding: 16px; 
            border-radius:10px; 
            box-shadow:0 0 10px #ccc;
        }
        .timer { 
            color:#dc3545; 
            font-weight:bold; 
            text-align:right; 
            margin-bottom:15px;
            font-size: 18px;
        }
        .question-header { 
            margin-bottom:20px;
        }
        .question-header h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
        }
        .question-header p { 
            margin: 0;
            font-size: 1.1em;
            font-weight: bold;
            line-height: 1.4;
        }
        .options { 
            display:flex; 
            flex-direction:column; 
            gap:12px;
            margin-top: 20px;
        }
        .option-btn { 
            padding: 14px 12px; 
            background:#007bff; 
            color:white; 
            border:none; 
            border-radius:6px; 
            cursor:pointer; 
            font-size: 15px; 
            text-align:left;
            transition: background 0.2s;
            min-height: 48px;
            display: flex;
            align-items: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .option-btn:active { background:#003d82; }
        
        @media (max-width: 600px) {
            .container { padding: 12px; margin: 5px auto; }
            .options { gap: 10px; }
            .option-btn { padding: 12px 10px; min-height: 44px; font-size: 14px; }
            .question-header p { font-size: 1em; }
        }
    </style>

    <script>
        let time = 600;
        function startTimer(){
            setInterval(()=>{
                let m = Math.floor(time/60);
                let s = time%60;
                document.getElementById("timer").innerText = m+":"+(s<10?"0":"")+s;
                time--;
                if(time < 0){ window.location = "/result"; }
            },1000);
        }
        window.onload = startTimer;
    </script>
</head>
<body>
    <div class="container">
        <div class="timer">⏱ <span id="timer">3:00</span></div>
        <div class="question-header">
            <h3>Въпрос {{ q_index }} / {{ total }}</h3>
            <p>{{ question }}</p>
        </div>

        <form action="/answer" method="post">
            <div class="options">
                {% for option in options %}
                <button type="submit" name="selected_option" value="{{ option }}" class="option-btn">
                    {{ option }}
                </button>
                {% endfor %}
            </div>
        </form>
    </div>
</body>
</html>
