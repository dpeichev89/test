<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background:#f4f6f8;
            margin: 0;
            padding: 10px;
        }
        .container { 
            max-width:700px; 
            margin: 10px auto; 
            background:white; 
            padding: 16px; 
            border-radius:10px; 
            box-shadow:0 0 10px #ccc;
        }
        h2 {
            margin: 0 0 20px 0;
            font-size: 1.3em;
            text-align: center;
        }
        .item { 
            margin-bottom:20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .item:last-child { border-bottom: none; }
        .item h3 { 
            margin: 0 0 12px 0;
            font-size: 1em;
            line-height: 1.4;
        }
        .badge { 
            display:inline-block; 
            padding: 6px 12px; 
            border-radius:12px; 
            color:white; 
            font-size: 0.9em;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .badge.correct { background:#28a745; }
        .badge.wrong { background:#dc3545; }
        .answer-row { 
            display:flex; 
            flex-direction: column;
            gap: 10px;
        }
        .answer-box { 
            background:#f8f9fa; 
            padding: 12px; 
            border-radius:6px;
            border-left: 4px solid #007bff;
        }
        .answer-box strong { 
            display:block; 
            margin-bottom: 6px;
            font-size: 0.9em;
            color: #666;
        }
        .answer-box span {
            display: block;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        a { 
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
            min-height: 44px;
            line-height: 44px;
        }
        a:active { background: #0056b3; }
        
        @media (max-width: 600px) {
            .container { padding: 12px; margin: 5px auto; }
            h2 { font-size: 1.1em; }
            .item { margin-bottom: 16px; padding-bottom: 16px; }
            .item h3 { font-size: 0.95em; }
            .answer-box { padding: 10px; }
            a { padding: 10px 20px; min-height: 40px; line-height: 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Резултат: {{ score }} / {{ total }}</h2>

        {% for a in answers %}
            <div class="item">
                <h3>{{ loop.index }}. {{ a.question }}</h3>
                <div class="badge {{ 'correct' if a.is_correct else 'wrong' }}">{{ '✔ Правилен' if a.is_correct else '✖ Грешен' }}</div>
                <div class="answer-row">
                    <div class="answer-box">
                        <strong>Твоят отговор:</strong>
                        <span>{{ a.user }}</span>
                    </div>
                    <div class="answer-box">
                        <strong>Правилен отговор:</strong>
                        <span>{{ a.correct }}</span>
                    </div>
                </div>
            </div>
        {% endfor %}

        <div style="text-align: center;">
            <a href="/">⬅ Назад</a>
        </div>
    </div>
</body>
</html>
